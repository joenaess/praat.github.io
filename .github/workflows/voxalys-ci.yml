name: Voxalys Native CI

on:
  push:
    branches:
      - feat/voxalys-native-vrp
      - main
      - master
  pull_request:
    branches:
      - feat/voxalys-native-vrp
      - main
      - master

jobs:
  rust-and-praat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & Audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --manifest-path external/voxalys_rust/Cargo.toml --check

      - name: Rust Clippy check
        run: cargo clippy --manifest-path external/voxalys_rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path external/voxalys_rust/Cargo.toml

      - name: Build Praat with Voxalys Rust static library
        run: |
          make -j"$(nproc)"
          ./praat --version

      - name: Run native Voxalys Praat regression tests
        run: ./praat --run test/dwtools/voxalys.praat
